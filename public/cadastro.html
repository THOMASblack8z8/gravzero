<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — GravZero</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</head>
<body class="auth-body">
  <nav class="navbar scrolled">
    <div class="nav-container">
      <a href="/" class="nav-logo">
        <i class="fas fa-feather-alt"></i>
        <span>GravZero</span>
      </a>
      <div class="nav-links">
        <a href="/" class="nav-link">Início</a>
        <a href="/login.html" class="nav-link">Entrar</a>
        <a href="/cadastro.html" class="nav-link active">Cadastrar</a>
      </div>
      <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('active')">
        <i class="fas fa-bars"></i>
      </button>
    </div>
  </nav>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon">
          <i class="fas fa-user-plus"></i>
        </div>
        <h1>Criar conta</h1>
        <p>Junte-se à plataforma GravZero</p>
      </div>

      <form id="cadastroForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="nome">
            <i class="fas fa-user"></i>
            Nome completo
          </label>
          <input type="text" id="nome" name="nome" placeholder="Ex.: Pedro Henrique" required>
        </div>

        <div class="form-group">
          <label for="email">
            <i class="fas fa-envelope"></i>
            E-mail
          </label>
          <input type="email" id="email" name="email" placeholder="seu.email@escola.com" required>
        </div>

        <div class="form-group">
          <label for="senha">
            <i class="fas fa-lock"></i>
            Senha
          </label>
          <div class="input-password">
            <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required minlength="6">
            <button type="button" class="toggle-password" onclick="togglePassword('senha', this)">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="turma">
            <i class="fas fa-graduation-cap"></i>
            Turma
          </label>
          <input type="text" id="turma" name="turma" placeholder="Ex.: 2º ano B" required>
        </div>

        <div id="mensagem" class="form-message" style="display:none;"></div>

        <button type="submit" class="btn btn-primary btn-block" id="btnCadastrar">
          <i class="fas fa-check-circle"></i>
          Cadastrar
        </button>
      </form>

      <div class="auth-footer">
        <p>Já tem conta? <a href="/login.html">Entrar</a></p>
      </div>
    </div>
  </main>

  <script src="/js/cadastro.js"></script>
</body>
</html>
