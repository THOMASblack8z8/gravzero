<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha — GravZero</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</head>
<body class="auth-body">
  <nav class="navbar scrolled">
    <div class="nav-container">
      <a href="/" class="nav-logo">
        <i class="fas fa-feather-alt"></i>
        <span>GravZero</span>
      </a>
      <div class="nav-links">
        <a href="/" class="nav-link">Início</a>
        <a href="/login.html" class="nav-link">Entrar</a>
        <a href="/cadastro.html" class="nav-link btn-nav">Cadastrar</a>
      </div>
      <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('active')">
        <i class="fas fa-bars"></i>
      </button>
    </div>
  </nav>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon">
          <i class="fas fa-key"></i>
        </div>
        <h1>Redefinir senha</h1>
        <p>Informe seu e-mail para receber as instruções</p>
      </div>

      <form id="redefinirForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="email">
            <i class="fas fa-envelope"></i>
            E-mail cadastrado
          </label>
          <input type="email" id="email" name="email" placeholder="seu.email@escola.com" required>
        </div>

        <div id="mensagem" class="form-message" style="display:none;"></div>

        <button type="submit" class="btn btn-primary btn-block" id="btnRedefinir">
          <i class="fas fa-paper-plane"></i>
          Enviar instruções
        </button>
      </form>

      <div class="auth-footer">
        <a href="/login.html">
          <i class="fas fa-arrow-left"></i>
          Voltar ao login
        </a>
      </div>
    </div>
  </main>

  <script src="/js/redefinir-senha.js"></script>
</body>
</html>
